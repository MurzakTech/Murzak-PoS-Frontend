name: Deploy Frontend
on:
  push:
    branches: [main]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
        env:
          CI: false
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
      - uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: build/
          remote_path: /var/www/pos/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      # Per-shop build, served at <shop>.pos.murzaktech.tech for customers who
      # buy POS on murzaktech.tech. Same source, two differences: the API is
      # same-origin (the shop's front door proxies /api to that shop's own
      # Frappe site, so one bundle serves every shop), and public sign-up is
      # off (see src/config/deployment.js).
      - run: npm run build
        env:
          CI: false
          BUILD_PATH: build-tenant
          REACT_APP_API_URL: /api/method
          REACT_APP_TENANT_MODE: "true"
      - uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: build-tenant/
          remote_path: /var/www/pos-tenant/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

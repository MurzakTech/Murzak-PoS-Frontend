name: Deploy Frontend
on:
  push:
    branches: [main]
  # Also startable by hand, and by the night-time dependency workflow (a merge made with a workflow's own
  # token does not trigger the push above, on purpose)
  workflow_dispatch:
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # Dependabot writes package-lock.json with npm 11. npm 10 (which Node 20 brings) refuses those files
      # ("Missing: yaml from lock file"), so every update it opened failed here. npm 11 reads both.
      - run: npm install -g npm@11
      - run: npm ci
      # A failing test stops the deploy, so a broken build never reaches the shops
      - name: Run automated tests
        run: npm test -- --watchAll=false --ci
        env:
          CI: true
      - run: npm run build
        env:
          CI: false
          # Keep every script in its own file so the security policy can allow only those
          INLINE_RUNTIME_CHUNK: false
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
      # Lets the page run only its own code and talk only to its own API (see SECURITY_REVIEW.md)
      - run: node scripts/add-security-policy.js build
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
      # Make sure the deploy is talking to OUR server before it sends anything. The rsync action does not check the
      # server's identity itself (it trusts whatever answers), so this compares the server's SSH fingerprint with the one
      # kept in the repository variable VPS_HOST_FINGERPRINT. See docs/DEPLOY_SECURITY.md.
      - name: Check the server's identity
        env:
          HOST: ${{ secrets.VPS_HOST }}
          EXPECTED: ${{ vars.VPS_HOST_FINGERPRINT }}
        run: |
          if [ -z "$EXPECTED" ]; then
            echo "::warning::VPS_HOST_FINGERPRINT is not set, so this deploy does not check which server it is talking to. See docs/DEPLOY_SECURITY.md."
            exit 0
          fi
          # Pasted values often carry stray spaces or line endings; ignore those
          expected="$(printf '%s\n' "$EXPECTED" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//; /^$/d')"
          scanned="$(ssh-keyscan -T 15 "$HOST" 2>/dev/null | ssh-keygen -lf - 2>/dev/null | awk '{print $2}')"
          if [ -z "$scanned" ]; then
            echo "::error::Could not read the server's SSH host key, so its identity could not be checked."
            exit 1
          fi
          if printf '%s\n' "$scanned" | grep -qxFf <(printf '%s\n' "$expected"); then
            echo "The server's fingerprint matches the one on record."
            exit 0
          fi
          echo "::error::The server's SSH fingerprint is not the one on record. Seen: $(printf '%s ' $scanned). Nothing was sent. If the server was rebuilt on purpose, update VPS_HOST_FINGERPRINT."
          exit 1
      - uses: burnett01/rsync-deployments@9.0.4
        with:
          switches: -avzr --delete
          path: build/
          remote_path: /var/www/pos/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      # Per-shop build, served at <shop>.pos.murzaktech.tech for customers who
      # buy POS on murzaktech.tech. Same source, two differences: the API is
      # same-origin (the shop's front door proxies /api to that shop's own
      # Frappe site, so one bundle serves every shop), and public sign-up is
      # off (see src/config/deployment.js).
      - run: npm run build
        env:
          CI: false
          BUILD_PATH: build-tenant
          INLINE_RUNTIME_CHUNK: false
          REACT_APP_API_URL: /api/method
          REACT_APP_TENANT_MODE: "true"
      - run: node scripts/add-security-policy.js build-tenant
        env:
          REACT_APP_API_URL: /api/method
      - uses: burnett01/rsync-deployments@9.0.4
        with:
          switches: -avzr --delete
          path: build-tenant/
          remote_path: /var/www/pos-tenant/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

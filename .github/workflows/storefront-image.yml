name: Storefront image

# Builds the per-shop online storefront container (deploy/storefront) and publishes it to the GitHub container
# registry, where the website's provisioning pulls it (STOREFRONT_IMAGE, default ghcr.io/murzaktech/murzak-storefront).
# Runs when the storefront or its build changes on main, or by hand.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'deploy/storefront/**'
      - '.github/workflows/storefront-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/storefront/Dockerfile
          push: true
          tags: |
            ghcr.io/murzaktech/murzak-storefront:latest
            ghcr.io/murzaktech/murzak-storefront:${{ github.sha }}

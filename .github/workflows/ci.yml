name: Tests
# Runs on every pull request, so a broken test is seen before the change is merged, not at deploy.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Automated tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Run automated tests
        run: npm test -- --watchAll=false --ci
        env:
          CI: true

  # The rules that decide which dependency updates may be merged at night. They run on a schedule with
  # no one watching, so they are tested here first.
  dependency-update-rules:
    name: Night-update rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - run: python .github/scripts/test_merge_dependency_updates.py

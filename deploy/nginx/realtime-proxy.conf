# Live updates (payments, kitchen tickets, held bills) for the till.
#
# Same rules as deploy/nginx/realtime-proxy.conf in the Murzak-PoS-Backend repository, tested on staging,
# with one change: the Frappe site name is read from $frappe_site instead of being written in, because the
# shared till and each shop's till talk to different Frappe sites.
#
# WHY THIS IS NEEDED
# The till page opens a live connection to ITS OWN address (browsers cannot attach the sign-in to a
# WebSocket, and Frappe's socket server refuses a page whose address differs from the socket's). So each
# page address must forward two things to the backend:
#   1. the live connection itself (/socket.io/), and
#   2. the sign-in check the socket server makes (/api/method/frappe.realtime.get_user_info).
# Step by step instructions: docs/NGINX_REALTIME_SETUP.md
#
# HOW TO USE
# 1. Once, in the `http { ... }` block (for example /etc/nginx/conf.d/websocket-upgrade.conf):
#
#        map $http_upgrade $connection_upgrade {
#            default upgrade;
#            ''      close;
#        }
#
# 2. Install this file as /etc/nginx/snippets/murzak-realtime-proxy.conf
# 3. In EACH page address's `server { ... }` block, set the Frappe site that address talks to, then include:
#
#        set $frappe_site api.pos.murzaktech.tech;     # pos.murzaktech.tech (the shared till)
#        include /etc/nginx/snippets/murzak-realtime-proxy.conf;
#
#    For a shop address, use the same site name that shop's existing /api rule already sends to Frappe.
#
# EDIT BEFORE USE
#   - 127.0.0.1:9000 is the Frappe socket server and 127.0.0.1:8000 the Frappe web server. If this Nginx
#     is on a different machine from the bench, put that machine's address there instead.

location /socket.io/ {
	proxy_pass http://127.0.0.1:9000;
	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection $connection_upgrade;
	proxy_set_header Host $host;
	proxy_set_header Origin $http_origin;
	proxy_set_header X-Frappe-Site-Name $frappe_site;
	proxy_read_timeout 3600s;   # keep quiet connections open
}

location = /api/method/frappe.realtime.get_user_info {
	proxy_pass http://127.0.0.1:8000;
	proxy_set_header Host $host;
	proxy_set_header X-Frappe-Site-Name $frappe_site;
}

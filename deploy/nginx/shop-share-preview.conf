# Link previews for shop links (name, line and logo when a shop's link is shared on WhatsApp and similar apps).
#
# WHY: WhatsApp, Facebook, Telegram and similar apps read a link's preview from the tags the server sends. They do not run the
# web app, so the tags the app sets in the browser (src/newlook/storefront/shopMeta.js) never reach them. This file sends those
# apps a small page with the shop's tags, and sends everybody else the normal app.
#
# NOT YET TESTED ON A LIVE SERVER. nginx was not available where this was written. Before relying on it:
#   1. The backend must provide `murzak_pos.api.storefront_api.share_page(slug)`, returning a small HTML page whose <head> has
#      og:title (shop name), og:description (tagline), og:image (the logo as a FULL web address) and og:url (see ONLINE_STORE.md).
#   2. Test with:  curl -A "WhatsApp/2.23" https://<shop>/shop/<name>   (should show the tags)
#                  curl https://<shop>/shop/<name>                      (should show the normal app)
#   3. Share a real link in a WhatsApp chat. Previews are cached by the app; add ?v=2 to see a change.
#
# INSTALL: put the `map` block in the `http { ... }` context (for example /etc/nginx/conf.d/), and include the `location` file
# inside each shop `server { ... }` block, above the location that serves the app.

# ---- http context ----
map $http_user_agent $shop_preview_bot {
    default 0;
    "~*(WhatsApp|facebookexternalhit|Facebot|Twitterbot|TelegramBot|Slackbot|LinkedInBot|Discordbot)" 1;
}

# ---- server context ----
# Only the shop's front page is previewed (not checkout or order pages, which belong to one shopper).
location ~ ^/shop/(?<shop_slug>[a-z0-9-]+)/?$ {
    if ($shop_preview_bot) {
        rewrite ^ /api/method/murzak_pos.api.storefront_api.share_page?slug=$shop_slug break;
        proxy_pass http://127.0.0.1:8000;   # the backend, as in the server's other /api location
    }
    try_files /index.html =404;
}

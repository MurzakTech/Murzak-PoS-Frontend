# Security headers for the Murzak POS web app.
#
# The page already carries a Content-Security-Policy (added at build time by
# scripts/add-security-policy.js). These are the protections only the web
# server can send. Browsers combine both policies, so the one here only needs
# frame-ancestors.
#
# Install once on the server (see SECURITY_REVIEW.md, "Server headers"):
#   include /etc/nginx/snippets/murzak-security-headers.conf;
# inside each `server { ... }` block for pos.murzaktech.tech and the shop sites.

# Stop other websites from showing the till inside a frame to trick staff into clicking
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;

# Make browsers trust the declared file types, never guess them
add_header X-Content-Type-Options "nosniff" always;

# Send only the site name, never full addresses, when following links elsewhere
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Do not let the page use the camera, microphone or location
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Always use HTTPS for a year once a browser has visited over HTTPS.
# Only enable after confirming the site and every shop site work over HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;
